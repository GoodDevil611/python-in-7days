<!DOCTYPE html>
<html>
<head>
    <title>Learn Python in 7 Days</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e1e2f, #2c2c54);
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 15px;
            width: 200px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #00ffcc;
            cursor: pointer;
            font-weight: bold;
        }

        .locked {
            background: rgba(255,255,255,0.05);
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            opacity: 0.7;
        }
    </style>
</head>

<body>

<h1>🐍 Learn Python in 7 Days</h1>
<p>Start from zero → become a beginner coder 🚀</p>

<div class="container">

    <!-- Day 1 -->
    <div class="card">
        <h2>Day 1</h2>
        <p>Introduction</p>
        <button onclick="openDay(1)">Start</button>
    </div>

    <!-- Day 2 -->
    <div class="card locked">
        <h2>Day 2 🔒</h2>
        <button onclick="unlockDay(2)">Unlock</button>
    </div>

    <!-- Day 3 -->
    <div class="card locked">
        <h2>Day 3 🔒</h2>
        <button onclick="unlockDay(3)">Unlock</button>
    </div>

    <!-- Day 4 -->
    <div class="card locked">
        <h2>Day 4 🔒</h2>
        <button onclick="unlockDay(4)">Unlock</button>
    </div>

    <!-- Day 5 -->
    <div class="card locked">
        <h2>Day 5 🔒</h2>
        <button onclick="unlockDay(5)">Unlock</button>
    </div>

    <!-- Day 6 -->
    <div class="card locked">
        <h2>Day 6 🔒</h2>
        <button onclick="unlockDay(6)">Unlock</button>
    </div>

    <!-- Day 7 -->
    <div class="card locked">
        <h2>Day 7 🔒</h2>
        <button onclick="unlockDay(7)">Unlock</button>
    </div>

</div>

<div class="footer">
    <p>💡 Tip: Complete each day to unlock the next</p>
</div>

<script>
function openDay(day){
    if(day === 1 || localStorage.getItem("day" + day)){
        window.location = "day" + day + ".html";
    } else {
        alert("🔒 Locked! Watch ad or wait.");
    }
}

function unlockDay(day){
    let lastUnlock = localStorage.getItem("time" + day);

    if(lastUnlock){
        let now = new Date().getTime();
        let diff = now - lastUnlock;

        if(diff < 2 * 60 * 60 * 1000){ // 2 hours cooldown
            alert("⏳ Come back later or watch ad!");
            return;
        }
    }

    showAd(day);
}

function showAd(day){
    alert("🎬 Fake Ad Playing... (you'll add real ads later)");

    localStorage.setItem("day" + day, "unlocked");
    localStorage.setItem("time" + day, new Date().getTime());

    alert("✅ Day " + day + " Unlocked!");
}
</script>

</body>
</html>
