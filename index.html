<h1>🐍 Learn Python in 7 Days</h1>

        <h2>Day 2</h2>

        <button onclick="unlockDay(2)">Unlock</button>

    </div>

        <h2>Day 6</h2>
        <p id="timer6">🔒 Locked</p>
        <button onclick="unlockDay(6)">Unlock</button>
    </div>

        <h2>Day 7</h2>

<script>

function completeDay(day){
    localStorage.setItem("completed" + day, "yes");
    updateProgress();
}

function updateProgress(){
    let completed = 0;

    for(let i = 1; i <= 7; i++){
        if(localStorage.getItem("completed" + i)){
            completed++;
        }
    }

    let percent = (completed / 7) * 100;
    document.getElementById("progressBar").style.width = percent + "%";
    document.getElementById("progressText").innerText = completed + "/7 Completed";
}

const COOLDOWN = 1 * 60 * 1000; // 1 minute (change later)

function openDay(day){
    if(day === 1){
        window.location = "day1.html";
        return;
    }

    if(localStorage.getItem("completed" + (day - 1))){
        window.location = "day" + day + ".html";
    } else {
        alert("🔒 Complete previous day first!");
    }
}

function unlockDay(day){
    let last = localStorage.getItem("time" + day);
    let unlocked = localStorage.getItem("day" + day);

    // already unlocked → open page
    if(unlocked){
        openDay(day);
        return;
    }

    // first click → start timer
    if(!last){
        localStorage.setItem("time" + day, Date.now());
        alert("⏳ Timer started!");
        return;
    }

    let now = Date.now();
    let diff = now - last;

    if(diff < COOLDOWN){
        alert("⏳ Still waiting!");
        return;
    }

    // cooldown finished → unlock
    localStorage.setItem("day" + day, "unlocked");
    alert("✅ Unlocked! Click again to open.");
}

function updateTimers(){
    for(let i = 2; i <= 7; i++){
        let el = document.getElementById("timer" + i);
        if(!el) continue;

        let unlocked = localStorage.getItem("day" + i);
        let last = localStorage.getItem("time" + i);

        if(unlocked){
            el.innerHTML = "✅ Unlocked";
            continue;
        }

        if(!last){
            el.innerHTML = "🔒 Locked";
            continue;
        }

        let now = Date.now();
        let diff = now - last;
        let remaining = COOLDOWN - diff;

        if(remaining > 0){
            let m = Math.floor(remaining / 60000);
            let s = Math.floor((remaining % 60000) / 1000);
            el.innerHTML = "⏳ " + m + "m " + s + "s";
        } else {
            el.innerHTML = "🔓 Ready";
        }
    }
}

setInterval(updateTimers, 1000);
updateTimers();
updateProgress();
</script>

</body>
