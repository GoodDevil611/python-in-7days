<script>
const COOLDOWN = 1 * 60 * 1000; // 1 minute (change later)

function openDay(day){
    if(day === 1 || localStorage.getItem("day" + day)){
        window.location = "day" + day + ".html";
    } else {
        alert("🔒 Locked!");
    }
}


function unlockDay(day){
    let last = localStorage.getItem("time" + day);
    let unlocked = localStorage.getItem("day" + day);

    // already unlocked → open page
    if(unlocked){
        openDay(day);
        return;
    }

    // first click → start timer
    if(!last){
        localStorage.setItem("time" + day, Date.now());
        alert("⏳ Timer started!");
        return;
    }

    let now = Date.now();
    let diff = now - last;

    if(diff < COOLDOWN){
        alert("⏳ Still waiting!");
        return;
    }

    // cooldown finished → unlock
    localStorage.setItem("day" + day, "unlocked");
    alert("✅ Unlocked! Click again to open.");
}

function updateTimers(){
    for(let i = 2; i <= 7; i++){
        let el = document.getElementById("timer" + i);
        if(!el) continue;

        let unlocked = localStorage.getItem("day" + i);
        let last = localStorage.getItem("time" + i);

        if(unlocked){
            el.innerHTML = "✅ Unlocked";
            continue;
        }

        if(!last){
            el.innerHTML = "🔒 Locked";
            continue;
        }

        let now = Date.now();
        let diff = now - last;
        let remaining = COOLDOWN - diff;

        if(remaining > 0){
            let m = Math.floor(remaining / 60000);
            let s = Math.floor((remaining % 60000) / 1000);
            el.innerHTML = "⏳ " + m + "m " + s + "s";
        } else {
            el.innerHTML = "🔓 Ready";
        }
    }
}

setInterval(updateTimers, 1000);
updateTimers();
</script>
